[project]
name = "pinocchio-rerun"
version = "0.1.0"
description = "Pinocchio visualization via Rerun"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
cmake = ">=3.26"
ninja = "*"
compilers = "*"
ccache = "*"
pinocchio = "*"
coal = "*"
assimp = "*"
eigenpy = "*"
example-robot-data = "*"
librerun-sdk = "==0.24.1"
fmt = "10.*"
gtest = "*"
pip = "*"
ruff = "*"

# Optional PyPI (none for now)
[pypi-dependencies]
rerun-sdk = ">=0.24,<0.25"

[tasks.configure]
cmd = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -G Ninja"
inputs = ["CMakeLists.txt"]
outputs = ["build/CMakeCache.txt"]

[tasks.build]
cmd = "cmake --build build -j"
depends-on = ["configure"]
inputs = ["CMakeLists.txt", "src/**/*.cpp", "src/**/*.hpp", "include/**/*.hpp", "**/*.c", "**/*.h"]
outputs = ["build/**/*"]

[tasks.install]
cmd = "cmake --install build"
depends-on = ["build"]
inputs = ["build/lib/**/*", "build/python/**/*"]
outputs = [".pixi/envs/default/lib/libpinocchio_rerun.so", ".pixi/envs/default/lib/python3.11/site-packages/pinocchio_rerun/**/*"]

[tasks.test]
cmd = "ctest --test-dir build --output-on-failure"
depends-on = ["build"]

[tasks.format-check]
cmd = "ruff check ."

[tasks.check]
cmd = "echo 'All checks passed'"
depends-on = ["test", "format-check"]

[tasks.example-solo8]
cmd = "python examples/solo8.py"
depends-on = ["install"]

[tasks.example-talos]
cmd = "python examples/talos.py"
depends-on = ["install"]

[tasks.example-ur5]
cmd = "python examples/ur5.py"
depends-on = ["install"]

[tasks.example-manipulability]
cmd = "python examples/manipulability_ellipsoid.py"
depends-on = ["install"]

[tasks.clean]
cmd = "rm -rf build"

